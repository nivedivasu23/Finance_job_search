name: Refresh Bengaluru fresher finance jobs
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: finpath-daily
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public employer vacancies
        run: python fetch_jobs.py
      - name: Commit feed
        run: | git config user.name "github-actions[bot]" git config user.email "41898282+github-actions[bot]@users.noreply.github.com" git add jobs.json if ! git diff --cached --quiet; then git commit -m "Update finance vacancies" git push fi
